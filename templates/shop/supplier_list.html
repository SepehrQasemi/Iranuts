{% extends 'Base.html'%}
{% block content %}
<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Name</th>
            <th>Province</th>
            <th>Phone</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for supplier in supplier_list %}
            <tr>
                <td>{{ supplier.name }}</td>
                <td>{{ supplier.province }}</td>
                <td>{{ supplier.phone }}</td>
                <td><a href="{% url 'SupplierDetail' supplier.id %}" class="btn btn-sm btn-primary">View</a></td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="4">No suppliers found.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'SupplierCreate' %}" class="btn btn-success">Add supplier</a>
{% endblock content %}
