{% extends 'Base.html' %}
{% block content %}
<ul class="list-group m-5 align-items-center">
    <h1>Inventories</h1>
    {% for inventory in inventory_list %}
        <li class="list-group-item city-list w-50">
            <div class="row">
                <div class="col-8">{{ inventory.province }}</div>
                <div class="col">
                    <a href="{% url 'InventoryDelete' inventory.id %}" class="btn btn-danger">Delete</a>
                </div>
                <div class="col">
                    <a href="{% url 'InventoryEdit' inventory.id %}" class="btn btn-secondary">Edit</a>
                </div>
            </div>
        </li>
    {% empty %}
        <li class="list-group-item w-50">No inventories found.</li>
    {% endfor %}
    <a href="{% url 'InventoryCreate' %}" class="btn btn-success mt-2">Add Inventory</a>
</ul>
{% endblock %}
