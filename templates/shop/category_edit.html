{% extends 'Base.html'%}
{% block content %}
<form action="" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save</button>
</form>
<br>
<a href="{% url 'CategoryDetail' category.id %}" class="btn btn-secondary">Cancel</a>
<a href="{% url 'CategoryDelete' category.id %}" class="btn btn-danger">Delete category</a>
{% endblock content %}
